name: Dissociation Research CI

on:
  pull_request:
    paths:
      - "research/dissociation/**"
      - "tests/test_dissociation_*.py"
      - "doc/DISSOCIATION_OPIOID_GLUTAMATE_HYPOTHESES.md"
      - ".github/workflows/dissociation-research.yml"
  push:
    branches:
      - master
    paths:
      - "research/dissociation/**"
      - "tests/test_dissociation_*.py"
      - ".github/workflows/dissociation-research.yml"

jobs:
  dissociation-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<2" "pytest>=7.4,<9"

      - name: Run dissociation research tests
        run: |
          python -m pytest -q             tests/test_dissociation_state_gating.py             tests/test_dissociation_state_graph.py             tests/test_dissociation_state_network.py
