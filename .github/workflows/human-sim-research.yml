name: HumanSim Research CI

on:
  pull_request:
    paths:
      - "research/human_sim/**"
      - "tests/test_human_sim_*.py"
      - "zeropain/verification.py"
      - "zeropain/verified_io.py"
      - "zeropain/verification_scrub.py"
      - ".github/workflows/human-sim-research.yml"
  push:
    branches:
      - master
    paths:
      - "research/human_sim/**"
      - "tests/test_human_sim_*.py"
      - ".github/workflows/human-sim-research.yml"

jobs:
  human-sim-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<2" "pytest>=7.4,<9"

      - name: Run HumanSim tests
        run: |
          python -m pytest -q tests/test_human_sim_*.py

      - name: Strict verified HumanSim smoke run
        env:
          ZEROPAIN_VERIFY: "1"
          ZEROPAIN_VERIFY_STRICT: "1"
          ZEROPAIN_VERIFY_REPLAY: "1"
          ZEROPAIN_VERIFY_REFERENCE: "1"
          ZEROPAIN_VERIFY_REFERENCE_NRMSE: "0.08"
          ZEROPAIN_VERIFY_LOG: /tmp/human_sim_verification.jsonl
        run: |
          python -m research.human_sim.run_pbpk_receptor \
            --duration-h 6 \
            --dt-h 0.05 \
            --initial-central-units 1.0 \
            --trace \
            --output /tmp/human_sim_pbpk_receptor.json

          python -m research.human_sim.run_population \
            research/human_sim/examples/httkpop_synthetic_fixture.csv \
            --source-id synthetic_fixture \
            --duration-h 3 \
            --dt-h 0.05 \
            --initial-central-units 1.0 \
            --output /tmp/human_sim_population.json

          python -m research.human_sim.run_multiligand \
            --duration-h 3 \
            --dt-h 0.05 \
            --output /tmp/human_sim_multiligand.json

          python -m zeropain.verification_scrub \
            --log /tmp/human_sim_verification.jsonl \
            --report /tmp/human_sim_verification_scrub.json

      - name: Upload HumanSim diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-sim-research-audits
          path: |
            /tmp/human_sim_*.json
            /tmp/human_sim_verification.jsonl
          if-no-files-found: ignore
          retention-days: 14
